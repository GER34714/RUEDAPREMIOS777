<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Ruleta</title><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script></head><body><main class="wrap"><header><div><span class="eyebrow">ADMINISTRACIÓN</span><h1>Ruleta de Premios</h1></div><button id="logout" class="dark">Cerrar sesión</button></header><section id="login" class="card login"><h2>Acceso administrador</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Contraseña"><button id="loginBtn">Ingresar</button><p id="loginMsg"></p></section><section id="app" hidden><div class="stats"><div><b id="totalSpins">0</b><span>Giros</span></div><div><b id="uniquePhones">0</b><span>Celulares</span></div><div><b id="activePrizes">0</b><span>Premios activos</span></div></div><div class="grid"><section class="card"><div class="sectionHead"><h2>Configuración</h2><button id="saveSettings">Guardar</button></div><label>Título<input id="siteTitle"></label><label>Texto principal<input id="heading"></label><label>WhatsApp<input id="whatsapp" placeholder="541164499481"></label><label>Logo<input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp"></label><img id="logoPreview" class="logoPreview"><p id="settingsMsg"></p></section><section class="card"><div class="sectionHead"><h2>Premios</h2><button id="newPrize">+ Nuevo premio</button></div><div id="prizeList"></div></section></div><section class="card"><div class="sectionHead"><h2>Giros registrados</h2><button id="refresh">Actualizar</button></div><div class="tableWrap"><table><thead><tr><th>Fecha</th><th>Nombre</th><th>Celular</th><th>Premio</th></tr></thead><tbody id="spinsBody"></tbody></table></div></section></section></main><script src="admin.js"></script></body></html>
